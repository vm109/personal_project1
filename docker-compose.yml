version: "3.9"

services:
  app:
    build:
      context: ./
      dockerfile: Dockerfile
      no_cache: true
    container_name: task_tracker_app
    ports:
      - "8090:8080"
    depends_on:
      - mongo

  mongo:
    image: mongo:6.0
    container_name: task_tracker_mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
      - ./mongo-init:/docker-entrypoint-initdb.d:ro

  mongo-init:
    image: mongo:6.0
    container_name: task_tracker_mongo_init
    depends_on:
      mongo:
        condition: service_started
    volumes:
      - ./mongo-init/jobListingIndexes.js:/jobListingIndexes.js:ro
    entrypoint: [ "sh", "-c", "echo 'Waiting for Mongo...' \
           && until mongosh --host mongo --eval 'db.adminCommand({ ping: 1 })' >/dev/null 2>&1; do sleep 1; done \
           && echo 'Running index script' \
            && mongosh --host mongo /jobListingIndexes.js" ]
    restart: "no"

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.9.0
    container_name: task_tracker_elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=true
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:9200/_cluster/health" ]
      interval: 30s
      timeout: 10s
      retries: 5

  kibana:
    image: docker.elastic.co/kibana/kibana:8.9.0
    container_name: task_tracker_kibana
    ports:
      - "5601:5601"
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    depends_on:
      - elasticsearch

volumes:
    mongo_data:
    es_data: